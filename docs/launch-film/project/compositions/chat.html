      tl.to("#c-scan", { y: 580, duration: 2.0, ease: "none" }, 3.0);

      });
      tl.fromTo("#c-lg1", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 6.0);
      tl.fromTo("#c-a2", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25 }, 7.55);
      [4, 6, 7, 9].forEach((i, k) => tl.fromTo(["#c-rg" + i, "#c-ic" + i], { opacity: 0 }, { opacity: 1, duration: 0.2 }, 7.8 + k * 0.1));
      tl.fromTo("#c-lg3", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 8.15);
      [5, 10].forEach((i, k) => tl.fromTo(["#c-rg" + i, "#c-ic" + i], { opacity: 0 }, { opacity: 1, duration: 0.2 }, 9.25 + k * 0.1));
      tl.fromTo("#c-lg2", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 9.4);
      tl.fromTo("#c-a3", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25 }, 10.45);
      tl.fromTo("#c-q", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25 }, 11.0);
