  <script>
    (function () {
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const $ = (s) => document.querySelector(s);
      const S = 0.32; // grid scale of a 1032 x 702 print
      const CX = [420, 780, 1140, 1500], CY = [262.5, 509.5, 756.5];
      const ROT = [-1.6, 1.1, -0.6, 1.8, 0.9, -1.3, 1.5, -0.8, -1.9, 0.7, -1.1, 1.3];
      const cell = (i) => ({ cx: CX[i % 4], cy: CY[Math.floor(i / 4)] });
      const ids = Array.from({ length: 12 }, (_, i) => String(i + 1).padStart(2, "0"));
      const place = (cx, cy) => ({ x: cx - 516, y: cy - 351 });

      // ---- grid state for all prints and the magnifier copies
      ids.forEach((id, i) => {
        const { cx, cy } = cell(i);
        gsap.set("#d-q" + id, { ...place(cx, cy), scale: S, rotation: ROT[i], transformOrigin: "50% 50%" });
        gsap.set("#d-p" + id, { ...place(cx, cy), scale: S, rotation: ROT[i], transformOrigin: "50% 50%", zIndex: 10 });
      });

      // ---- L1: the aperture opens on one print (0.0 - 5.0)
      gsap.set("#d-p01", { ...place(960, 480), scale: 1, rotation: -1.2, zIndex: 12 });
      ids.slice(1).forEach((id) => gsap.set("#d-p" + id, { opacity: 0 }));
      gsap.set(["#d-head", "#d-pill"], { opacity: 0 });
      gsap.set([1, 2, 3, 4, 5, 6, 7].map((n) => "#d-m" + n), { opacity: 0, scale: 0 });
      gsap.set(["#d-c1x", "#d-c2x", "#d-c3x", "#d-c1s", "#d-c1t span", "#d-c2t span", "#d-c3t span"], { opacity: 0 });
      const ap = { r: 70, a: 0 };
      const hex = () => {
        const pts = [];
        for (let k = 0; k < 6; k++) { const t = ap.a + (k * Math.PI) / 3; pts.push(`${(960 + ap.r * Math.cos(t)).toFixed(1)}px ${(480 + ap.r * Math.sin(t)).toFixed(1)}px`); }
        $("#d-sheet").style.clipPath = ap.r > 1400 ? "none" : `polygon(${pts.join(",")})`;
      };
      tl.fromTo(ap, { r: 70, a: 0 }, { r: 1500, a: 0.9, duration: 0.7, ease: "power3.inOut", onUpdate: hex }, 0);
      tl.fromTo("#d-fade", { opacity: 0.75 }, { opacity: 0, duration: 1.6, ease: "power2.out" }, 0.2);
      tl.fromTo("#d-p01", { scale: 1 }, { scale: 1.045, duration: 4.4, ease: "sine.inOut" }, 0.6);

      // ---- L2: twelve, shared (5.0 - 13.0)
      const c1 = cell(0);
      tl.to("#d-p01", { ...place(c1.cx, c1.cy), scale: S, rotation: ROT[0], duration: 1.05, ease: "power3.inOut" }, 5.0);
      tl.set("#d-p01", { zIndex: 10 }, 6.05);
      ids.slice(1).forEach((id, k) => {
        const i = k + 1, { cx, cy } = cell(i);
        const t = 5.2 + k * 0.065;
        const sx = cx + (cx - 960) * 1.7, sy = cy + 760 + (i % 3) * 60;
        tl.fromTo("#d-p" + id, { ...place(sx, sy), scale: S * 1.25, rotation: ROT[i] + (i % 2 ? 14 : -12), opacity: 1 },
          { ...place(cx, cy), scale: S, rotation: ROT[i], duration: 0.8, ease: "expo.out" }, t);
      });
      tl.fromTo("#d-h1", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 6.5);
      tl.set("#d-head", { opacity: 1 }, 6.5);
      tl.fromTo("#d-h2", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2 }, 6.62);
      tl.fromTo("#d-pill", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.55, ease: "expo.out" }, 8.1);
      tl.fromTo("#d-roll", { y: 0 }, { y: -58, duration: 0.42, ease: "power3.inOut" }, 10.7);
      tl.fromTo("#d-pill", { backgroundColor: "#eeede7" }, { backgroundColor: "#f3c8c9", duration: 0.3 }, 10.75);

      // ---- L3: the light drops, the lens reads like a stranger (13.0 - 20.0)
      tl.fromTo("#d-dim", { opacity: 0 }, { opacity: 0.64, duration: 0.7, ease: "power2.inOut" }, 13.0);
      const PATH = [[-260, 262.5], [420, 262.5], [780, 262.5], [1140, 262.5], [1500, 262.5], [1500, 509.5], [1140, 509.5], [780, 509.5], [420, 509.5], [420, 756.5], [780, 756.5], [1140, 756.5], [1500, 756.5], [2250, 756.5]];
      const T0 = 13.3, T1 = 19.9, SEG = (T1 - T0) / (PATH.length - 1);
      const cr = (p0, p1, p2, p3, t) => 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t * t * t);
      const lensAt = (u) => {
        const n = PATH.length - 1, s = Math.min(n - 1e-6, Math.max(0, u * n)), i = Math.floor(s), f = s - i;
        const P = (k) => PATH[Math.max(0, Math.min(n, k))];
        return [cr(P(i - 1)[0], P(i)[0], P(i + 1)[0], P(i + 2)[0], f), cr(P(i - 1)[1], P(i)[1], P(i + 1)[1], P(i + 2)[1], f)];
      };
      const M = 1.9, R = 163;
      const lens = { u: 0, x: -260, y: 262.5, mag: 1 };
      const drawLens = () => {
        $("#d-lens-g").setAttribute("transform", `translate(${lens.x.toFixed(2)} ${lens.y.toFixed(2)})`);
        const mg = $("#d-mag");
        mg.style.transformOrigin = "0 0";
        mg.style.transform = `translate(${(lens.x - M * lens.x).toFixed(2)}px, ${(lens.y - M * lens.y).toFixed(2)}px) scale(${M})`;
        mg.style.clipPath = `circle(${(R / M).toFixed(2)}px at ${lens.x.toFixed(2)}px ${lens.y.toFixed(2)}px)`;
      };
      tl.set("#d-lens", { opacity: 1 }, T0);
      tl.set("#d-mag", { opacity: 1 }, T0);
      tl.fromTo(lens, { u: 0 }, { u: 1, duration: T1 - T0, ease: "none", onUpdate: () => { const [x, y] = lensAt(lens.u); lens.x = x; lens.y = y; drawLens(); } }, T0);
      tl.set("#d-mag", { opacity: 0 }, T1);
      // markers: [print index, path index, marker number]
      const MARK = [[0, 1, 1], [7, 5, 2], [6, 6, 3], [5, 7, 4], [4, 8, 5], [9, 10, 6], [10, 11, 7]];
      const mpos = (i) => { const { cx, cy } = cell(i); return [cx + 142, cy - 90]; };
      for (const [pi, k, n] of MARK) {
        const [mx, my] = mpos(pi);
        const t = T0 + k * SEG + 0.06;
        gsap.set("#d-m" + n, { x: mx - 28, y: my - 28 });
        tl.fromTo("#d-m" + n, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(2.4)" }, t);
        tl.set("#d-p" + ids[pi], { zIndex: 30 }, t);
      }


      // ---- L4: three exhibits, hard cuts (20.0 - 27.0)
      tl.set("#d-close", { opacity: 1 }, 20.0);
      tl.set("#d-sheet", { opacity: 0 }, 20.0);
      tl.set("#d-sheet", { opacity: 1 }, 27.0);
      const shots = [["#d-c1", 20.0], ["#d-c2", 22.33], ["#d-c3", 24.67]];
      shots.forEach(([sid, t], k) => {
        tl.set(sid, { opacity: 1 }, t);
        if (k < 2) tl.set(sid, { opacity: 0 }, shots[k + 1][1]);
        tl.fromTo(sid + "p", { scale: 1.07 }, { scale: 1, duration: 0.7, ease: "expo.out" }, t);
        tl.fromTo(sid + "box", { attr: { "stroke-dashoffset": 1.1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.42, ease: "power2.inOut" }, t + 0.3);
        tl.fromTo(sid + "lead", { attr: { "stroke-dashoffset": 1.1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power2.out" }, t + 0.62);
        tl.fromTo(sid + "x", { opacity: 0 }, { opacity: 1, duration: 0.16 }, t + 0.78);
        document.querySelectorAll(sid + "t span").forEach((w, j) => {
          tl.fromTo(w, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, t + 0.86 + j * 0.09);
        });
        if (document.querySelector(sid + "s")) tl.fromTo(sid + "s", { opacity: 0 }, { opacity: 1, duration: 0.25 }, t + 0.95);
      });
      // pull back into the contact sheet
      tl.fromTo("#d-close", { scale: 1, opacity: 1, transformOrigin: "1140px 509.5px" }, { scale: 0.24, opacity: 0, duration: 0.5, ease: "power3.in" }, 27.0);

      // ---- L5: the red thread and the file pages (27.0 - 35.0)
      const pins = [0, 4, 5, 9, 10, 6, 7].map(mpos);
      let d = `M${pins[0][0]} ${pins[0][1]}`;
      for (let k = 1; k < pins.length; k++) {
        const [ax, ay] = pins[k - 1], [bx, by] = pins[k];
        const mx = (ax + bx) / 2, my = (ay + by) / 2;
        const horiz = Math.abs(bx - ax) > Math.abs(by - ay);
        d += ` Q${(mx + (horiz ? 0 : 26)).toFixed(1)} ${(my + (horiz ? 46 : 0)).toFixed(1)} ${bx} ${by}`;
      }
      $("#d-thread-line").setAttribute("d", d);
      $("#d-thread-shadow").setAttribute("d", d);
      tl.fromTo(["#d-thread-line", "#d-thread-shadow"], { attr: { "stroke-dashoffset": 1.1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 2.1, ease: "power1.inOut" }, 29.0);
      const pages = [["#d-pgA", 300, 150, -4, 31.15], ["#d-pgB", 690, 340, 3, 32.15], ["#d-pgC", 1080, 200, -2.5, 33.15]];
      for (const [pid, x, y, r, t] of pages) {
        gsap.set(pid, { x, y, opacity: 0 });
        tl.fromTo(pid, { x, y: y - 30, scale: 1.32, rotation: r + 7, opacity: 0, transformOrigin: "50% 50%" }, { y, scale: 1, rotation: r, opacity: 1, duration: 0.2, ease: "power3.in" }, t);
        tl.fromTo("#d-sheet", { y: 0 }, { y: 9, duration: 0.04, ease: "none" }, t + 0.2);
        tl.to("#d-sheet", { y: 0, duration: 0.3, ease: "power2.out" }, t + 0.24);
      }
      // the lens returns to the centre; the music drops out; snap to black
      tl.set(lens, { x: 2250, y: 540 }, 33.9);
      tl.fromTo(lens, { x: 2250, y: 540 }, { x: 960, y: 540, duration: 0.95, ease: "expo.out", onUpdate: drawLens }, 33.95);
      tl.set("#d-black", { opacity: 1 }, 35.0);
      tl.set({}, {}, 36);
      window.__timelines["desk"] = tl;
    })();
  </script>
</template>
